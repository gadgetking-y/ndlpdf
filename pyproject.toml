[project]
name = "ndlpdf"
version = "0.1.0"
description = "NDLOCR-Lite を使って PDF を OCR し、透明テキスト埋め込み PDF（検索可能 PDF）を作成する CLI ツール"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Makoto Yamashita", email = "mkt921y@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/gadgetking-y/ndlpdf"
Repository = "https://github.com/gadgetking-y/ndlpdf"
Issues = "https://github.com/gadgetking-y/ndlpdf/issues"

[project.scripts]
ndlpdf = "ndlpdf:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
